<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120d09">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Zum Homescreen hinzufügen auf iPhone/iPad -->
  <link rel="apple-touch-icon" href="art/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Eldoria">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Eldoria</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='12' y='6' width='40' height='52' rx='6' fill='%238a2a1a' stroke='%23e2b85a' stroke-width='4'/><path d='M32 18l4 9 10 1-8 6 3 10-9-6-9 6 3-10-8-6 10-1z' fill='%23e2b85a'/></svg>">
  <!-- Alle Schriften liegen im Projekt (@font-face in style.css), es wird nichts von fremden Servern geladen -->
  <link rel="preload" href="art/fonts/cinzel-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="art/fonts/alegreya-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=201">
  <!-- Inhalt erst zeigen, wenn Cinzel/Alegreya geladen sind (kein kurzes Aufblitzen der Ersatzschrift) -->
  <style>html.fonts-loading body > * { visibility: hidden; }</style>
  <script>
    (function () {
      var root = document.documentElement;
      if (!document.fonts || !document.fonts.load) return;
      root.classList.add('fonts-loading');
      var done = function () { root.classList.remove('fonts-loading'); };
      Promise.all(['600 1em Cinzel', '800 1em Cinzel', '900 1em Cinzel',
        '500 1em Alegreya', '700 1em Alegreya', '800 1em Alegreya'].map(function (f) {
        return document.fonts.load(f);
      })).then(done, done);
      setTimeout(done, 2000);
    })();
  </script>
</head>
<body>
  <!-- Hauptmenü -->
  <section id="menu" class="screen intro-open">
    <div class="menu-bg" id="menu-bg" aria-hidden="true"><div class="fog high"></div><div class="fog low"></div></div>
    <div class="embers" id="fireflies" aria-hidden="true"></div>
    <!-- Startbildschirm: der Klick darauf gibt zugleich den Ton frei (Browser erlauben ihn erst nach einer Nutzeraktion) -->
    <div class="intro" id="intro">
      <p class="title">Eldoria</p>
      <p class="subtitle">Das Quartett der Völker</p>
      <button class="btn-primary" id="intro-btn" autofocus>Spiel betreten</button>
    </div>
    <div class="menu-audio">
      <button class="btn-small sfx-toggle" data-tip="Soundeffekte an/aus" aria-label="Soundeffekte an/aus">🔊</button>
      <button class="btn-small music-toggle" data-tip="Musik an/aus" aria-label="Musik an/aus">🎵</button>
      <button class="btn-small fs-toggle" data-tip="Vollbild an/aus (F)" aria-label="Vollbild an/aus" hidden></button>
    </div>

    <div class="menu-layout">
      <div class="menu-hero">
        <div class="menu-cards" id="menu-cards" aria-hidden="true"></div>
        <h1 class="title">Eldoria</h1>
        <p class="subtitle">Das Quartett der Völker</p>
        <ol class="how">
          <li><span class="how-icon">🗺️</span><span><b>Das Schlachtfeld</b> bestimmt, welche Eigenschaft zählt.</span></li>
          <li><span class="how-icon">🂠</span><span><b>Verdeckt wählen</b> – der Sieger erobert beide Karten.</span></li>
          <li><span class="how-icon">🏆</span><span><b>Drei Quartette</b> gewinnen.</span></li>
        </ol>
      </div>

      <div class="menu-box">
        <h2 class="menu-heading">Neues Spiel</h2>
        <div class="mode-tiles" id="mode-select">
          <button data-mode="pvc" class="mode-tile active">
            <span class="mode-icon">🤖</span><span class="mode-name">Gegen den Computer</span>
            <span class="mode-desc">Allein spielen, sofort loslegen</span>
          </button>
          <button data-mode="online" class="mode-tile">
            <span class="mode-icon">👥</span><span class="mode-name">Online</span>
            <span class="mode-desc">Freunde per Link oder Raumcode einladen</span>
          </button>
        </div>
        <div class="menu-row" id="difficulty-row">
          <span class="label">Stärke des Computers</span>
          <div class="seg" id="difficulty-select">
            <button data-diff="easy">Leicht</button>
            <button data-diff="normal" class="active">Normal</button>
            <button data-diff="hard">Schwer</button>
          </div>
        </div>
        <div class="menu-row names" id="names-row">
          <label>Dein Name <input id="name1" maxlength="14" placeholder="Spieler"></label>
        </div>
        <button id="start-btn" class="btn-primary start-big">Spiel starten</button>
        <div class="menu-row menu-links">
          <button id="rules-btn" class="btn-secondary">📜 Regeln</button>
          <button id="gallery-btn" class="btn-secondary">🖼️ Kartengalerie</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Spiel -->
  <section id="game" class="screen hidden">
    <main class="table">
      <header class="topbar">
        <div id="round-info" class="round-info"></div>
        <div class="top-buttons">
          <!-- auf dem Handy hochkant im Spielmenü (☰), damit die Leiste in eine Zeile passt -->
          <button class="btn-small sfx-toggle in-menu" data-label="Effekte" data-tip="Soundeffekte an/aus" aria-label="Soundeffekte an/aus">🔊</button>
          <button class="btn-small music-toggle in-menu" data-label="Musik" data-tip="Musik an/aus" aria-label="Musik an/aus">🎵</button>
          <button class="btn-small fs-toggle in-menu" data-label="Vollbild" data-tip="Vollbild an/aus (F)" aria-label="Vollbild an/aus" hidden></button>
          <button id="overview-btn" class="btn-small only-narrow">📋 Übersicht</button>
          <button id="help-btn" class="btn-small in-menu">📜 Regeln</button>
          <button id="menu-btn" class="btn-small">☰ Menü</button>
        </div>
      </header>
      <div class="opp-row"><div class="player-bar opp" id="bar-1"></div><div class="opp-hand" id="opp-hand"></div></div>
      <div class="battlefield" id="battlefield">
        <div class="deck" id="deck-0"></div>
        <div class="slot" id="slot-0"></div>
        <div class="center" id="center"><div id="terrain-box"></div><div class="pot" id="pot"></div><div class="center-rest" id="center-rest" aria-live="polite"></div></div>
        <div class="slot" id="slot-1"></div>
        <div class="deck" id="deck-1"></div>
      </div>
      <div class="player-bar me" id="bar-0"></div>
      <div class="hand-area" id="hand-area">
        <div class="hand-title" id="hand-title" aria-live="polite"></div>
        <div class="hand" id="hand"></div>
        <div class="hand-actions" id="hand-actions"></div>
      </div>
    </main>
    <aside class="sidebar" id="sidebar">
      <h3>Quartett-Übersicht</h3>
      <div class="legend" id="legend"></div>
      <div class="overview" id="overview"></div>
      <h3>Verlauf</h3>
      <div class="log" id="log"></div>
    </aside>
  </section>

  <div id="overlay" class="overlay hidden"></div>

  <template id="rules-tpl">
    <div class="modal rules">
      <h2>Spielregeln</h2>
      <p class="rules-goal"><b>Ziel:</b> Sammle zuerst <b>3 Quartette</b> – je alle 4 Karten eines Volkes.</p>
      <h3>So wird gespielt</h3>
      <ol class="rules-quick">
        <li><span>🗺️</span><div>Das <b>Schlachtfeld</b> bestimmt, was zählt: ⚔️ Stärke, 🛡️ Rüstung, ✨ Magie oder 💨 Tempo.</div></li>
        <li><span>🃏</span><div>Beide spielen <b>verdeckt</b> eine von 3 Handkarten.</div></li>
        <li><span>⚔️</span><div>Der <b>höhere Wert</b> erobert beide Karten.</div></li>
        <li><span>📥</span><div>Beide ziehen auf 3 Karten nach.</div></li>
        <li><span>🏁</span><div>Das Spiel endet bei <b>3 Quartetten</b>, spätestens nach 40 Runden.</div></li>
      </ol>
      <button class="btn-primary" data-close>Verstanden</button>
    </div>
  </template>

  <script src="js/cards.js?v=201"></script>
  <script src="js/engine.js?v=201"></script>
  <script src="js/ai.js?v=201"></script>
  <script src="js/net.js?v=201"></script>
  <script src="js/audio.js?v=201"></script>
  <script src="js/ui.js?v=201"></script>
  <script src="js/deer.js?v=201"></script>
  <script>
    // Offline-Fähigkeit (sw.js). Nicht beim direkten Öffnen der Datei; auf localhost nur mit ?sw, damit beim
    // Entwickeln keine alten Skripte aus dem Cache kommen
    if ('serviceWorker' in navigator && location.protocol !== 'file:'
      && (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname) || /[?&]sw\b/.test(location.search))) {
      navigator.serviceWorker.register('sw.js?v=201');
    }
  </script>
</body>
</html>
